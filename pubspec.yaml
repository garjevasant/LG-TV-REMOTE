name: lg_webos_remote
description: A Flutter remote for LG webOS televisions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: android/assets/ICON.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
